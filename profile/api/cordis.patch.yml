# 这一份部署的插件接线。密钥来自启动时注入的环境变量，不写在这里。

- insert:
    # 脑只对外暴露 `/brain/v1`（HTTP + 会话级 SSE）。全局 DSH Host 面
    # （`/api` 前缀路由、`/api/remote.mux` Upgrade、各 Remote 命名空间）
    # 全部摘除：启动审计强制 Upgrade 路由为 0，见 §3.1/§3.3。

    # 工作区归平台所有；脑侧只是 `dsh_workspaces` 的投影，不碰宿主目录。
    - id: workspace
      name: '@brain/dsh-workspace-platform'

    # 只提供 `sessionController` 内部服务（`/brain/v1/.../projections` 与 fork 用）。
    # 没有 connection / api-remotes，它不会注册任何 HTTP 路由；它依赖的
    # `typertGateway` 由下面的 typert-gateway 提供，`fileUploads` 由占位服务提供。
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'
      config:
        nativeOpen: false

    # 浏览器上传由平台收口（`P/upload`），脑收不到回执；这个占位只满足
    # session-controller 的装配依赖，不提供任何上传路由。
    - id: file-uploads-stub
      name: '@brain/dsh-file-uploads-stub'

    # 页面直接拉文件树/预览时没有回合上下文；按请求里的会话把调用钉进沙箱作用域。
    - id: workspace-files-session
      name: '@brain/dsh-e2b/workspace-files'

    - id: database
      name: '@brain/dsh-database'
      config:
        # 本地默认 SQLite 文件；部署时改用 url。
        file: !!js process.env.DSH_DATABASE_FILE ?? ''
        url: !!js process.env.DSH_DATABASE_URL ?? ''
        maxConnections: 10

    - id: session-persistence
      name: '@brain/dsh-session-pg'
      config:
        leaseMs: 30000

    - id: session-directory
      name: '@brain/dsh-session-directory'
      config:
        cacheTtlMs: 30000

    - id: sandboxes
      name: '@brain/dsh-e2b/sandboxes'
      config:
        adapter: !!js process.env.SANDBOX_ADAPTER || 'e2b'
        mock:
          objectDir: !!js process.env.DSH_LOCAL_STORE || ''
        docker:
          image: !!js process.env.DSH_DOCKER_IMAGE || 'node:22-bookworm-slim'
          objectDir: !!js process.env.DSH_LOCAL_STORE || ''
          network: !!js process.env.DSH_DOCKER_NETWORK || 'none'
          user: !!js process.env.DSH_DOCKER_USER || ''
        scope: workspace
        sandboxTimeoutMs: 3600000
        idleMs: 3600000
        sweepIntervalMs: 60000
        reclaimOrphans: false
        volumeMountPath: "/desk"
        volumeNameTemplate: "desk-{workspaceId}"
        privateSkillDir: "/skillbox/own"
        publicSkillDir: "/skillbox/common"
        ossMounts:
          - bucketName: !!js process.env.OSS_BUCKET ?? ''
            endpoint: !!js process.env.OSS_ENDPOINT ?? ''
            bucketPath: "desks/{workspaceId}"
            mountDir: "/desk"
            readOnly: false
        storeKind: postgres
        directory: !!js ctx.get('sessionDirectory')
        e2b:
          apiKey: !!js process.env.E2B_API_KEY ?? ''
          apiUrl: !!js process.env.E2B_API_URL ?? ''
          domain: !!js process.env.E2B_DOMAIN ?? ''
          template: !!js process.env.E2B_TEMPLATE ?? ''
          onTimeout: kill
          connectTimeoutMs: 3600000
          allowInternetAccess: true
          allowPublicTraffic: false
          roleArn: !!js process.env.E2B_ROLE_ARN ?? ''
          requestTimeoutMs: 15000
          commandTimeoutMs: 3600000

    - id: credentials-session
      name: '@brain/dsh-credentials-session'
      config:
        ref: DSH_MODEL_KEY

    - id: user-skills
      name: '@brain/dsh-user-skills'
      config:
        privateRoot: /skillbox/own
        publicRoot: /skillbox/common

    - id: user-mcp
      name: '@brain/dsh-user-mcp'
      config:
        credentialsKeyEnv: DSH_CREDENTIALS_KEY
        defaultToolCallTimeoutMs: 60000

    - id: web-limiter
      name: '@brain/dsh-web-limiter'
      config:
        maxGlobal: 4
        maxPerUser: 2
        maxQueue: 32
        queueMs: 10000

    - id: workspace-policy
      name: '@brain/dsh-workspace-policy'

    - id: schedule-tasks
      name: '@brain/dsh-schedule-tasks'

    - id: tool-abort-policy
      name: '@brain/dsh-tool-abort-policy'
      config:
        abortGraceMs: 0

    # 正文里的 `dsh-ui` 围栏由浏览器半渲染；宿主半只注册 `validate_dsh_ui` /
    # `render_ui` 工具和内置 genui skill，不碰沙箱。
    - id: genui
      name: '@changfenhuang/dsh-genui'

    # 平台不提供浏览器内动态插件：不挂宿主半 cordis-host-runner，也不给
    # 输入端「创建插件」入口。会话里的 `dsh-ui` 围栏由 genui 单独渲染。
    - id: attachment-oss
      name: '@brain/dsh-attachment-oss'
      config:
        dshHome: !!js process.env.DSH_HOME ?? '/data'
        maxImageBytes: 20971520
        maxImagesPerMessage: 20

- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: !!js process.env.DSH_HOST
    port: !!js Number(process.env.PORT)

- id: platform-api
  name: '@brain/dsh-platform-api'
  config:
    requireUser: true
    pageSize: 200
    heartbeatMs: 15000
    # 回合看门狗：running 回合连续 10 分钟没有任何进度（持久事件 / 模型流 /
    # 本会话后台任务输出）就强制收尾。0 关闭。
    turnStallMs: 600000
    apps:
      - appId: !!js process.env.PLATFORM_APP_ID ?? 'platform'
        appKey: !!js process.env.PLATFORM_APP_KEY
        name: platform

- id: sandbox-policy
  config:
    # 会话的 cwd 就是沙箱里的工作卷挂载点；没有会话的调用也按它兜底。
    mode: workspace-write
    workspaceRoot: /desk

- id: permission
  config:
    defaultPreset: workspace-write
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never

- id: approval
  config:
    # 收窄访问的调用要走人工确认；浏览器侧的审批面板由 client-ui-approval 提供。
    policy: ask

# session-controller 依赖 `typertGateway` 服务；本部署没有 `connection`，
# 这个插件只提供内部服务，不会注册 `/api/remote.mux` 的 Upgrade 或任何路由。
- id: typert-gateway

- id: credentials
  disabled: true

- id: llm-deepseek
  disabled: true

# pi-ai 的 `api` 是路由级配置，一条路由只能说一种线协议；成员在设置里选的
# 协议经 `x-dsh-model-api` 下发，平台 API 按协议选下面这些路由。`user` 是
# openai-completions 的历史名字，老平台不带请求头时行为不变。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      user:
        displayName: User model
        apiKeyEnv: DSH_MODEL_KEY
        api: openai-completions
        baseURL: http://dsh-model.invalid
        headers: {}
        models:
          - id: unconfigured
            name: Unconfigured
            contextWindow: 128000
            maxTokens: 8192
            input:
              - text
      user-openai-responses:
        displayName: User model (OpenAI Responses)
        apiKeyEnv: DSH_MODEL_KEY
        api: openai-responses
        baseURL: http://dsh-model.invalid
        headers: {}
        models:
          - id: unconfigured
            name: Unconfigured
            contextWindow: 128000
            maxTokens: 8192
            input:
              - text
      user-anthropic-messages:
        displayName: User model (Anthropic Messages)
        apiKeyEnv: DSH_MODEL_KEY
        api: anthropic-messages
        baseURL: http://dsh-model.invalid
        headers: {}
        models:
          - id: unconfigured
            name: Unconfigured
            contextWindow: 128000
            maxTokens: 8192
            input:
              - text
      user-google-generative-ai:
        displayName: User model (Gemini)
        apiKeyEnv: DSH_MODEL_KEY
        api: google-generative-ai
        baseURL: http://dsh-model.invalid
        headers: {}
        models:
          - id: unconfigured
            name: Unconfigured
            contextWindow: 128000
            maxTokens: 8192
            input:
              - text

- id: agent-default-model
  config:
    provider: user
    model: unconfigured

- id: fs-sandbox
  disabled: true

- id: session-persistence-jsonl
  disabled: true

- id: ptc-runtime
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-fs-search
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

- id: tool-bash
  config:
    enableRunInBackground: true
    promoteOnTimeout: true

- id: tool-goal
  config:
    blockedAfterConsecutiveRounds: 3

- id: attachment-local
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-log-deepseek
  disabled: true

- id: tool-working-directory
  disabled: true

- id: goal-round-driver
  # 目标激活后由驱动自动推进轮次；之前关着，目标建出来也不会自己跑。
  disabled: false

- id: web-search-deepseek
  disabled: true

- id: web-fetch-http
  config:
    maxResponseBytes: 1000000
    maxBodyChars: 50000
    timeoutMs: 15000
    maxRedirects: 3

- id: tool-web
  config:
    search: false
    fetch: true
    fetchTimeoutMs: 20000
    fetchMaxOutputChars: 60000
