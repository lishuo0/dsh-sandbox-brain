# The `platform` agent template: persona and the tools the profile cannot
# register globally.
#
# Tool rows in `@deepseek-ai/dsh-base` register at host scope, so they are
# visible to every session and this preset must not re-register them: a child
# row with the same tool name would shadow the host row and silently drop its
# config. The host rows enabled by `profile/api/cordis.patch.yml` are:
#
#   bash             ✅ sandbox   ctx.shell → ctx.subprocess → E2B
#   read/write/edit  ✅ sandbox   ctx.fs → E2B (apply_patch off)
#   job_*            ⚠️ partial   processes run in the sandbox; the job registry
#                                 is brain-local and lost on restart
#   subagent, subagent_fork,
#   list_agents, send_message,
#   wait_agent       ✅ shared    children resolve to the parent's workspace
#                                 and reuse its sandbox key (interrupt_agent
#                                 stays off: base sets interrupt:false)
#   skill            ✅ sandbox   @brain/dsh-user-skills reads the read-only
#                                 skill mounts through ctx.fs
#   schedule_*       ✅ platform  @brain/dsh-schedule-tasks writes the shared DB
#   web_fetch        ❌ brain     anonymous public HTTP, bounded by
#                                 @brain/dsh-web-limiter; web_search is off
#   create/get/update_goal,
#   todo_write,
#   exit_plan_mode   ✅ session   goal/todo/plan events in the session log
#   team_task_*      ✅ conditional only in Team mode; discovery is gated by
#                                 ctx.agentTeams.isEnabled
#
# This preset adds what the base does NOT register:
#
#   ask_user_question ✅ platform  ctx.userQuestions; answers arrive over the
#                                  platform's /api interactions channel
#   present           ✅ sandbox   validates files through ctx.fs and records
#                                  them as deliverables for the client UI
#
# Deliberately absent:
#
#   tool-workflow / workflow-ptc
#       Orchestration state lives in the process.
#   terminal-*
#       The E2B process provider does not implement PTY yet.
#   fs-search
#       Spawns the brain-hosted @vscode/ripgrep binary; that path does not
#       exist inside the sandbox. Use bash + grep/rg in the sandbox instead.
#   skill-filesystem
#       It scans the brain's filesystem; per-user skills come from
#       @brain/dsh-user-skills over the sandbox mounts instead.
#   read_image / attachments
#       The image tool needs the brain-side attachment store, whose files are
#       shared by every tenant; the profile disables `attachment-local` so the
#       tool never registers.
#   tool-office
#       Needs a WebSocket-based skill provider this deployment does not mount.
#
# Re-introduce each one only after its execution world and cross-replica
# behaviour are settled.
#
# The client's read-only preset viewer renders only the declared `plugins` list
# below; it does not expand host-scope tools. So `description` names the host
# capabilities the mode actually has, otherwise the card reads like the whole
# tool catalog is these five plugins.

- insert:
    - id: preset-platform
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: platform
        name: 标准模式
        # 客户端预设页只展开下面声明的 plugins，不会列出宿主注册的工具，
        # 所以描述里要写全这个模式实际能用的能力，否则卡片看起来只有五个插件。
        description: 平台默认模式。bash、文件读写、后台任务、技能、定时任务、子代理、目标与待办由宿主统一注册；本预设补充人设提示词、时间上下文、提问和产物展示。
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.

          - id: instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: time
            name: '@deepseek-ai/dsh-time-context'

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: present
            name: '@deepseek-ai/dsh-tool-present'
